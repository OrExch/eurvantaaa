<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Eurvanta</title>
    <meta name="description" content="Более 4-х лет на рынке. Быстрый обмен в день обращения. Конфиденциальность и комфорт.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Eurvanta">
    <meta property="og:description" content="Более 4-х лет на рынке. Быстрый обмен в день обращения. Конфиденциальность и комфорт.">
    <meta property="og:image" content="avatar.png">
    <link rel="icon" href="avatar.png">
    <style>
        :root {
            --page-bg: #07101f;
            --card-bg: #161d31;
            --card-border: rgba(232, 200, 114, 0.22);
            --text: #f6f3ea;
            --text-muted: #c5cedc;
            --accent-1: #e8c872;
            --accent-2: #c9a04a;
            --accent-3: #8d6b2b;
            --cta-shadow: rgba(201, 160, 74, 0.45);
            --dot-color: rgba(232, 200, 114, 0.14);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; padding: 0; min-height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .cover {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url("avatar.png");
            background-size: cover;
            background-position: center;
            filter: blur(34px) saturate(140%);
            transform: scale(1.25);
            opacity: 0.9;
        }

        .cover::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(7, 16, 31, 0.35) 0%, rgba(7, 16, 31, 0.88) 68%, var(--page-bg) 100%);
        }

        .shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 40px 18px calc(22px + env(safe-area-inset-bottom));
        }

        .card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 72px 26px 26px;
            position: relative;
            isolation: isolate;
            box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.55);
            text-align: center;
            animation: cardIn 0.5s cubic-bezier(.16, 1, .3, 1) both;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            background-image: radial-gradient(var(--dot-color) 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            background-position: -9px -9px;
            -webkit-mask-image: radial-gradient(130% 105% at 50% 0%, #000 42%, transparent 80%);
            mask-image: radial-gradient(130% 105% at 50% 0%, #000 42%, transparent 80%);
            pointer-events: none;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            position: absolute;
            top: 0;
            left: 50%;
            width: 108px;
            height: 108px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 2;
            overflow: hidden;
            background: #0a1840;
            box-shadow: 0 0 0 5px var(--card-bg), 0 0 0 6px rgba(232, 200, 114, 0.45), 0 14px 30px -8px rgba(0, 0, 0, 0.45);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .name, .description { position: relative; z-index: 1; }

        .name {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: 0.08em;
            margin: 8px 0 18px;
            text-transform: uppercase;
        }

        .description {
            font-size: 15px;
            line-height: 1.55;
            color: var(--text-muted);
            margin: 0 auto 26px;
            max-width: 360px;
        }

        .description p { margin: 0; }

        .cta {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 17px 22px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #1a1408;
            text-decoration: none;
            cursor: pointer;
            overflow: hidden;
            background: linear-gradient(135deg, #f8e7b0 0%, #e7c56a 46%, #d4a441 100%);
            box-shadow: 0 12px 30px -10px var(--cta-shadow);
            transition: transform 0.14s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .cta:hover {
            filter: brightness(1.05);
            box-shadow: 0 16px 36px -10px var(--cta-shadow);
        }

        .cta:active { transform: scale(0.99); }

        .cta svg { width: 18px; height: 18px; }

        .cta::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -120%;
            width: 55%;
            height: 200%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
            transform: skewX(-20deg);
            animation: shine 4s ease-in-out infinite;
        }

        @keyframes shine {
            0% { left: -120%; }
            55% { left: 130%; }
            100% { left: 130%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .cta::after, .card { animation: none; }
        }

        @media (max-width: 420px) {
            .card { padding: 68px 18px 22px; }
            .description { font-size: 14px; }
            .avatar { width: 96px; height: 96px; }
            .name { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="cover"></div>
    <div class="shell">
        <main class="card">
            <a class="avatar" href="https://t.me/+ItABUMyx1LU4NmYy" aria-label="Eurvanta">
                <img src="avatar-mark.png" alt="Eurvanta">
            </a>
            <h1 class="name">Eurvanta</h1>
            <div class="description">
                <p>- Более 4-х лет на рынке. Отзывы в&nbsp;канале&nbsp;✅</p>
                <p>- Быстрый обмен в&nbsp;день обращения</p>
                <p>- Конфиденциальность и&nbsp;комфорт</p>
            </div>
            <a class="cta" href="https://t.me/+ItABUMyx1LU4NmYy">
                Перейти в канал
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </a>
        </main>
    </div>
</body>
</html>
